# App images are built from their own repos, pinned to a CalVer tag (vYYYY.MM.DD) for
# reproducible deploys. Each app repo auto-creates that tag on every push to main
# (.github/workflows/auto-tag.yml), and .github/workflows/bump-app-versions.yml here picks
# it up and bumps versions.env, which is what triggers the deploy. Nothing to do by hand.

networks:
  media-network:
    external: true

services:
  # --- Google Calendar Bridge (ESP32 / local API) ---
  cal-bridge:
    build: https://github.com/PlatanosVerdes/cal-bridge.git#${CAL_BRIDGE_VERSION}
    container_name: cal-bridge
    labels:
      prometheus.probe: "http://cal-bridge:8000/health"
    restart: unless-stopped
    profiles: [cal, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    ports:
      - "8091:8000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CAL_API_KEY: ${CAL_API_KEY}
      CAL_BASE_URL: ${CAL_BASE_URL:-https://cal.platanosverdes.com}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SECRET_CREATES: ${MS_SECRET_CREATES:-}
      MS_SECRET_DAYS_DURATION: ${MS_SECRET_DAYS_DURATION:-}
    volumes:
      - ${APP_CONFIG_PATH}/cal-bridge:/data/tokens

  # NOTE: the one-pace-downloader used to be scheduled by a chadburn ("ofelia") container,
  # but chadburn never worked here (docker-socket GID mismatch + broken label discovery) so
  # it was removed. Scheduling is now meant to be a host cron. See PENDING.md.

  # --- One Pace downloader (run on demand or from a host cron) ---
  # docker compose run --rm one-pace-downloader
  one-pace-downloader:
    build: https://github.com/PlatanosVerdes/one-pace-downloader.git#${ONE_PACE_VERSION}
    container_name: one-pace-downloader
    restart: "no"
    profiles: [one-pace]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_ROOT}/series:/mnt/data/series
    command:
      - "--resolution"
      - "1080p"
      - "--output"
      - "/mnt/data/series"
      - "--pushgateway"
      - "http://pushgateway:9091"
      - "--plex-url"
      - "http://host.docker.internal:32400"
      - "--plex-token"
      - "${PLEX_API_TOKEN}"
      - "--plex-path"
      - "/data/series"
      #- "--arc"
      #- "skypiea"

  # --- Anisette server (Apple auth headers for air-tag; self-hosted, no Mac needed) ---
  # Pin to a digest for reproducibility once you have one:
  #   docker inspect --format '{{index .RepoDigests 0}}' anisette
  anisette:
    image: dadoum/anisette-v3-server@${ANISETTE_DIGEST}
    container_name: anisette
    labels:
      prometheus.probe: "http://anisette:6969/"
    restart: unless-stopped
    profiles: [airtag, all]
    networks:
      - media-network
    volumes:
      - ${APP_CONFIG_PATH}/anisette:/home/Alcoholic/.config/anisette-v3/lib/

  # --- AirTag tracker + map (internal only; reached via Caddy, no host port) ---
  air-tag:
    build: https://github.com/PlatanosVerdes/air-tag.git#${AIR_TAG_VERSION}
    container_name: air-tag
    labels:
      prometheus.probe: "http://air-tag:8000/"
    restart: unless-stopped
    profiles: [airtag, all]
    depends_on:
      - anisette
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    environment:
      APPLE_ID: ${AIRTAG_APPLE_ID}
      APPLE_PASSWORD: ${AIRTAG_APPLE_PASSWORD}
      AIRTAG_PRIVATE_KEY: ${AIRTAG_PRIVATE_KEY}
      ANISETTE_URL: http://anisette:6969
      POLL_INTERVAL: ${AIRTAG_POLL_INTERVAL:-900}
      TZ: ${TZ:-Europe/Madrid}
      DATA_DIR: /data
    volumes:
      - ${APP_CONFIG_PATH}/air-tag:/data

  # --- Telegram Bot for Academy Offers ---
  pol-academy-offers-bot:
    build: https://github.com/PlatanosVerdes/PolFerrerAcademyOffers.git#${POL_BOT_VERSION}
    container_name: pol-academy-offers-bot
    restart: unless-stopped
    profiles: [bot, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: host
    environment:
      BOT_TOKEN: ${BOT_POL_ACADEMY_OFFERS_TOKEN}
    volumes:
      - ${APP_CONFIG_PATH}/pol-academy-bot:/app/data

  # --- LaLiga Fantasy: panel de decisiones (mercado, clausulas, rivales) ---
  # Lee la API oficial de LaLiga Fantasy y futbolfantasy.com, y sirve un panel en
  # vivo (API JSON + push por SSE). Sin dependencias: la imagen es python-alpine
  # con el paquete copiado dentro.
  #
  # La sesion es lo unico que no se puede regenerar: se importa una vez desde el
  # navegador (`auth browser` + `auth code`) y se copia tokens.json a este volumen.
  # A partir de ahi el refresh token la mantiene viva, igual que la app oficial.
  #
  # Esta pagina PUEDE gastar dinero real: pujar, vender, aceptar ofertas y pagar
  # clausulas. Y ejecuta las instrucciones programadas (siempre-en-mercado,
  # clausulazos) sin preguntar, que es justamente para lo que estan: una clausula se
  # libera cuando se libera. Las instrucciones viven en data/policies.json y solo las
  # crea el usuario.
  #   --read-only  apaga toda operacion
  #   --no-auto    deja los botones pero suspende las instrucciones programadas
  # Por eso el basic_auth de services.caddy no es opcional.
  laliga-fantasy:
    build:
      context: https://github.com/PlatanosVerdes/laliga-fantasy.git#${LALIGA_FANTASY_VERSION}
      # The tag reaches the page header, so what is deployed is readable without a shell.
      args:
        VERSION: ${LALIGA_FANTASY_VERSION}
    container_name: laliga-fantasy
    labels:
      prometheus.probe: "http://laliga-fantasy:8000/healthz"
    restart: unless-stopped
    profiles: [fantasy, all]
    mem_limit: 320m
    memswap_limit: 320m
    # Writes are on: nothing moves without confirming it in the page, and the standing
    # instructions only fire within the limits set there.
    command: ["serve", "--port", "8000", "--interval", "120", "--deep"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # JSON por stdout: Vector ya recoge los logs de cada contenedor.
      FANTASY_LOG_JSON: "1"
    volumes:
      # Sesion, cache, favoritos e informe. La sesion debe persistir.
      - ${APP_CONFIG_PATH}/laliga-fantasy:/data
    networks:
      - media-network

  # --- Wallapop: reactivate expired listings daily ---
  # The session is imported by hand once and renews itself in place; see the repo README.
  wallapop-reactivator:
    build:
      context: https://github.com/PlatanosVerdes/wallapop-reactivator.git#${WALLAPOP_VERSION}
      args:
        VERSION: ${WALLAPOP_VERSION}
    container_name: wallapop-reactivator
    labels:
      prometheus.probe: "http://wallapop-reactivator:8000/healthz"
    restart: unless-stopped
    profiles: [wallapop, all]
    mem_limit: 64m
    memswap_limit: 64m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # It sends no messages: it reports state and the alert rules decide.
      WALLA_PUSHGATEWAY: http://pushgateway:9091
    volumes:
      # The session lives here, so it must persist.
      - ${APP_CONFIG_PATH}/wallapop-reactivator:/data

