# App images are built from their own repos, pinned to a CalVer tag (vYYYY.MM.DD) for
# reproducible deploys. Each app repo auto-creates that tag on every push to main
# (.github/workflows/auto-tag.yml). To deploy a new version: bump the #vYYYY.MM.DD ref
# in the build: line below to the desired tag, then commit.

networks:
  media-network:
    external: true

services:
  # --- Google Calendar Bridge (ESP32 / local API) ---
  cal-bridge:
    build: https://github.com/PlatanosVerdes/cal-bridge.git#v2026.07.01
    container_name: cal-bridge
    restart: unless-stopped
    profiles: [cal, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    ports:
      - "8091:8000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CAL_API_KEY: ${CAL_API_KEY}
      CAL_BASE_URL: ${CAL_BASE_URL:-https://cal.platanosverdes.com}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SECRET_CREATES: ${MS_SECRET_CREATES:-}
      MS_SECRET_DAYS_DURATION: ${MS_SECRET_DAYS_DURATION:-}
    volumes:
      - ${APP_CONFIG_PATH}/cal-bridge:/data/tokens

  # --- Chadburn scheduler (runs one-pace-downloader daily) ---
  ofelia:
    image: premoweb/chadburn:latest
    container_name: ofelia
    restart: unless-stopped
    profiles: [one-pace, all]
    command: daemon --metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - media-network
    labels:
      chadburn.enabled: "true"
      chadburn.job-run.one-pace-downloader.schedule: "0 3 * * *"
      chadburn.job-run.one-pace-downloader.image: "rpi-services-one-pace-downloader:latest"
      chadburn.job-run.one-pace-downloader.network: "media-network"
      chadburn.job-run.one-pace-downloader.dns: "8.8.8.8"
      chadburn.job-run.one-pace-downloader.volume: "${DATA_ROOT}/series:/mnt/data/series"
      chadburn.job-run.one-pace-downloader.command: "--resolution 1080p --output /mnt/data/series --pushgateway http://pushgateway:9091 --plex-url http://plex:32400 --plex-token ${PLEX_API_TOKEN} --plex-path /data/series"

  # --- One Pace downloader (run-once manually or via ofelia) ---
  # docker compose run --rm one-pace-downloader
  one-pace-downloader:
    build: https://github.com/PlatanosVerdes/one-pace-downloader.git#v2026.07.01
    container_name: one-pace-downloader
    restart: "no"
    profiles: [one-pace]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    volumes:
      - ${DATA_ROOT}/series:/mnt/data/series
    command:
      - "--resolution"
      - "1080p"
      - "--output"
      - "/mnt/data/series"
      - "--pushgateway"
      - "http://pushgateway:9091"
      - "--plex-url"
      - "http://plex:32400"
      - "--plex-token"
      - "${PLEX_API_TOKEN}"
      - "--plex-path"
      - "/data/series"
      #- "--arc"
      #- "skypiea"

  # --- Telegram Bot for Academy Offers ---
  pol-academy-offers-bot:
    build: https://github.com/PlatanosVerdes/PolFerrerAcademyOffers.git#v2026.07.01
    container_name: pol-academy-offers-bot
    restart: unless-stopped
    profiles: [bot, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: host
    environment:
      BOT_TOKEN: ${BOT_POL_ACADEMY_OFFERS_TOKEN}
    volumes:
      - ${APP_CONFIG_PATH}/pol-academy-bot:/app/data
