# App images come from GHCR, pinned in versions.env by bump-app-versions.yml.

networks:
  media-network:
    external: true
  # torre's alone: public-facing, so it shares no network with the rest.
  torre:
    name: torre
  # rpi-homeserver's, internal: where the bots expose /bot-stats (port 9180, never published).
  muninn:
    external: true

services:
  # NOTE: the one-pace-downloader used to be scheduled by a chadburn ("ofelia") container,
  # but chadburn never worked here (docker-socket GID mismatch + broken label discovery) so
  # it was removed. Scheduling is now meant to be a host cron. See PENDING.md.

  # --- One Pace downloader (run on demand or from a host cron) ---
  # docker compose run --rm one-pace-downloader
  one-pace-downloader:
    image: ghcr.io/platanosverdes/one-pace-downloader:${ONE_PACE_VERSION}
    container_name: one-pace-downloader
    restart: "no"
    profiles: [one-pace]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_ROOT}/series:/mnt/data/series
    command:
      - "--resolution"
      - "1080p"
      - "--output"
      - "/mnt/data/series"
      - "--pushgateway"
      - "http://pushgateway:9091"
      - "--plex-url"
      - "http://host.docker.internal:32400"
      - "--plex-token"
      - "${PLEX_API_TOKEN}"
      - "--plex-path"
      - "/data/series"
      #- "--arc"
      #- "skypiea"

  # --- Telegram Bot for Academy Offers ---
  pol-academy-offers-bot:
    image: ghcr.io/platanosverdes/polferreracademyoffers:${POL_BOT_VERSION}
    container_name: pol-academy-offers-bot
    labels:
      muninn.stats: "http://pol-academy-offers-bot:9180/bot-stats"
    restart: unless-stopped
    profiles: [bot, all]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
      - muninn
    environment:
      BOT_TOKEN: ${BOT_POL_ACADEMY_OFFERS_TOKEN}
      BOT_NAME: PolFerrerAcademyOffersBot
      BOT_STATS_ADDR: ":9180"
    volumes:
      - ${APP_CONFIG_PATH}/pol-academy-bot:/app/data

  # --- LaLiga Fantasy: decision panel (market, clauses, rivals) ---
  # Reads the official LaLiga Fantasy API and futbolfantasy.com and serves a live panel.
  # The session is the one thing that cannot be regenerated: it is set from the page itself
  # and the refresh token keeps it alive in /data.
  #
  # This page CAN spend real money (bids, sales, offers, clauses) and runs the standing
  # instructions in /data/policies.json without asking. `--read-only` turns every write off,
  # `--no-auto` keeps the buttons but suspends the standing instructions.
  #
  # So it is never reachable without a login. Two doors: 8000 is the tailnet one, through
  # Caddy; 8001 is the Cloudflare tunnel's (fantasy.platanosverdes.com -> 127.0.0.1:8771),
  # behind Access with Google, and the app itself refuses any request without a valid Access
  # token there. The tailnet door is the way in when Cloudflare is blocked during matches.
  laliga-fantasy:
    image: ghcr.io/platanosverdes/laliga-fantasy:${LALIGA_FANTASY_VERSION}
    container_name: laliga-fantasy
    labels:
      prometheus.probe: "http://laliga-fantasy:8000/healthz"
      # The public way in, through the tunnel and Access: healthy is the redirect to the login.
      prometheus.probe.access: "https://fantasy.platanosverdes.com/"
    restart: unless-stopped
    profiles: [fantasy, all]
    mem_limit: 320m
    memswap_limit: 320m
    # Writes are on: nothing moves without confirming it in the page, and the standing
    # instructions only fire within the limits set there.
    command: ["serve", "--port", "8000", "--access-port", "8001", "--interval", "120", "--deep"]
    ports:
      - "127.0.0.1:8771:8001"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # JSON on stdout: Vector already collects every container's logs.
      FANTASY_LOG_JSON: "1"
      # futbolfantasy's ceilings only change with the nightly price adjustment: one read a day each.
      FANTASY_CEILING_TTL: 24h
      FANTASY_ACCESS_TEAM_DOMAIN: platanosverdes.cloudflareaccess.com
      FANTASY_ACCESS_AUD: b30deb0cd1a12b5bb963010d5e107743820f201f4a7c11273d44799ab29c1609
      # Seals the LaLiga sessions in /data; kept in SOPS, so a copy of the volume alone opens nothing.
      FANTASY_SECRET_KEY: ${FANTASY_SECRET_KEY}
    volumes:
      # Session, cache, favourites and report. The session must persist.
      - ${APP_CONFIG_PATH}/laliga-fantasy:/data
    networks:
      - media-network

  # --read-only stays fixed: a branch under test never moves money.
  # Own data and login: sharing prod's refresh token would end prod's session.
  laliga-fantasy-stage:
    image: ghcr.io/platanosverdes/laliga-fantasy:${LALIGA_FANTASY_STAGE_VERSION}
    container_name: laliga-fantasy-stage
    restart: unless-stopped
    profiles: [fantasy, all]
    deploy:
      replicas: ${LALIGA_FANTASY_STAGE_ON:-0}
    mem_limit: 320m
    memswap_limit: 320m
    command: ["serve", "--port", "8000", "--read-only", "--interval", "600"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      FANTASY_LOG_JSON: "1"
      FANTASY_CEILING_TTL: 24h
    volumes:
      - ${APP_CONFIG_PATH}/laliga-fantasy-stage:/data
    networks:
      - media-network

  # --- Wallabot: the public bot that watches Wallapop searches ---
  wallabot:
    image: ghcr.io/platanosverdes/wallabot:${WALLABOT_VERSION}
    container_name: wallabot
    labels:
      prometheus.probe: "http://wallabot:8000/healthz"
      muninn.stats: "http://wallabot:9180/bot-stats"
    restart: unless-stopped
    profiles: [wallapop, all]
    # Hashing a thumbnail decodes it first.
    mem_limit: 128m
    memswap_limit: 128m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
      - muninn
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WALLA_PUSHGATEWAY: http://pushgateway:9091
      # Its own bot, public: Telegram carries the new listings of each chat's searches.
      WALLA_TELEGRAM_TOKEN: ${WALLA_TELEGRAM_TOKEN}
      WALLA_TELEGRAM_CHAT: ${WALLA_TELEGRAM_CHAT}
      WALLA_BOT_NAME: WuallaBot
      WALLA_STATS_ADDR: ":9180"
    volumes:
      # The chats, their searches and what each has already been told.
      - ${APP_CONFIG_PATH}/wallabot:/data

  # --- Wallapop catalogue: reactivate my expired listings daily ---
  # The session is imported by hand once and renews itself in place; see the repo README.
  wallapop-catalogue:
    image: ghcr.io/platanosverdes/wallapop-catalogue:${WALLAPOP_CATALOGUE_VERSION}
    container_name: wallapop-catalogue
    labels:
      prometheus.probe: "http://wallapop-catalogue:8000/healthz"
    restart: unless-stopped
    profiles: [wallapop, all]
    mem_limit: 64m
    memswap_limit: 64m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - media-network
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # State is reported as metrics and the alert rules decide.
      WALLA_PUSHGATEWAY: http://pushgateway:9091
      # @PlatanosServicesBot: this is the only service reading its updates, and it answers
      # the owner's chat alone (/wallapop_estado, /wallapop_reactivar).
      WALLA_TELEGRAM_TOKEN: ${TELEGRAM_BOT_SERVICES}
      WALLA_TELEGRAM_CHAT: ${WALLA_TELEGRAM_CHAT}
    volumes:
      # The session and the last pass.
      - ${APP_CONFIG_PATH}/wallapop-catalogue:/data


  # --- torre: AENA's flight board on the phone, and alerts for followed flights ---
  # Public, through the Cloudflare Tunnel (hostname torre.platanosverdes.com -> http://localhost:8770
  # in the tunnel's dashboard config). It sits on a network of its own, so a compromise from the
  # internet reaches nothing else on the Pi, and it listens on loopback only, so the tunnel is the
  # one way in. That is also what makes CF-Connecting-IP trustworthy for the rate limits.
  torre:
    image: ghcr.io/platanosverdes/torre:${TORRE_VERSION}
    container_name: torre
    labels:
      # Probed through the public hostname, so the tunnel is checked along with the service.
      prometheus.probe: "https://torre.platanosverdes.com/healthz"
      muninn.stats: "http://torre:9180/bot-stats"
    restart: unless-stopped
    profiles: [torre, all]
    # Two-week boards of BCN and MAD held at once peaked at 107 MiB.
    mem_limit: 192m
    memswap_limit: 192m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    ports:
      - "127.0.0.1:8770:8000"
    networks:
      - torre
      - muninn
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # @TorreFlightsBot, torre's own: it sends the alerts, signs Mini App launches and torre is the
      # one reader of its updates.
      TORRE_TELEGRAM_TOKEN: ${TELEGRAM_BOT_TORRE}
      TORRE_BOT_UPDATES: "1"
      TORRE_BOT_NAME: TorreFlightsBot
      TORRE_PUBLIC_URL: https://torre.platanosverdes.com
      TORRE_CLIENT_IP_HEADER: CF-Connecting-IP
      TORRE_STATS_ADDR: ":9180"
      TORRE_COLLECT: PMI,BCN
      TORRE_SAMPLE: "200"
    volumes:
      # The followed flights. The image runs as uid 10001, so the directory must be created owned by
      # it before the first start: sudo install -d -o 10001 -g 10001 -m 700 appdata/torre
      - ${APP_CONFIG_PATH}/torre:/data
