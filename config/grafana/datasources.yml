# Mounted into rpi-homeserver's Grafana (EXT_GRAFANA_DATASOURCES): streamhalla's own Prometheus,
# reached over Tailscale, so its dashboards live in the one Grafana with the Google sign-in.
apiVersion: 1

# The name is what the dashboards' Node selector shows. Provisioning matches by name and refuses a
# second datasource with the same uid, so the old name is deleted before this one is inserted.
deleteDatasources:
  - name: Prometheus streamhalla
    orgId: 1

datasources:
  - name: streamhalla
    uid: prometheus-streamhalla
    type: prometheus
    access: proxy
    url: http://100.120.107.32:9090
    editable: false
